name: State Validation

# Validates the .ai/state JSON source-of-truth on every push and PR.
# This is the CI mirror of the pre-commit hook — it stops state drift from merging.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate state files (strict)
        # --strict fails on leftover REPLACE_* placeholders (drift in a real project). The baseline repo
        # carries a `.praxis-template` marker, which downgrades that check to warnings here — so this same
        # workflow passes on the template and stays strict for real projects (which have no marker).
        run: python3 scripts/validate_state.py --strict --root .
